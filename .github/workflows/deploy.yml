name: Auto Deploy UrbanShield to Google Cloud Run

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công khi đã cấu hình GCP_SA_KEY

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: "${{ secrets.GCP_SA_KEY != '' }}"

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 3. Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 4. Deploy to Google Cloud Run
        run: |
          gcloud run deploy urbanshield-sgu \
            --source . \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated
